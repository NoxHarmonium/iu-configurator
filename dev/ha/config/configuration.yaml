# ── Dev configuration for iu-configurator integration testing ─────────────────
#
# Irrigation Unlimited config is generated by iu-configurator and bind-mounted
# into the container at /config/iu/ (see docker-compose.yml).
# HA reads it via `!include iu/irrigation_unlimited.yaml` below.
#
homeassistant:
  name: "Dev"
  latitude: -37.8274851
  longitude: 144.9496239
  unit_system: metric
  time_zone: Australia/Melbourne
  country: AU

# Required stubs (HA won't start without these if referenced below)
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Verbose logging for IU to make integration testing easier
logger:
  default: warning
  logs:
    custom_components.irrigation_unlimited: debug

# ── Irrigation Unlimited ──────────────────────────────────────────────────────
# The included file is written by iu-configurator to ../config/ on the host,
# which is bind-mounted read-only into HA at /config/iu/.
# After saving a new schedule in iu-configurator, reload IU via the HA UI
# (Developer Tools → YAML → Reload Irrigation Unlimited), or automatically
# via the HA API once HA_URL + HA_TOKEN are configured in docker-compose.yml.
irrigation_unlimited: !include iu/irrigation_unlimited.yaml

# ── Simulated zone entities ───────────────────────────────────────────────────
# Zone 4 is configured as an input_boolean in definitions.rs; define it here
# so HA doesn't log an "entity not found" error for it.
# The switch.* entities for zones 1-3 and 5-8 are created by template below.
input_boolean:
  irrigation_zone_4:
    name: "4. Natives (simulated)"
    initial: false

# Template switches simulating the physical irrigation zone valves.
# Entity IDs are derived from the `name` key (snake_cased) so they match
# the entity_id values in src/definitions.rs.
template:
  - switch:
      - name: "front_irrigation_controller_l1"
        unique_id: "front_irrigation_controller_l1"
        state: "off"
        turn_on:
          - action: logger.log
            data:
              message: "zone 1 on (simulated)"
              level: info
        turn_off:
          - action: logger.log
            data:
              message: "zone 1 off (simulated)"
              level: info

      - name: "front_irrigation_controller_l2"
        unique_id: "front_irrigation_controller_l2"
        state: "off"
        turn_on:
          - action: logger.log
            data: { message: "zone 2 on (simulated)", level: info }
        turn_off:
          - action: logger.log
            data: { message: "zone 2 off (simulated)", level: info }

      - name: "front_irrigation_controller_l3"
        unique_id: "front_irrigation_controller_l3"
        state: "off"
        turn_on:
          - action: logger.log
            data: { message: "zone 3 on (simulated)", level: info }
        turn_off:
          - action: logger.log
            data: { message: "zone 3 off (simulated)", level: info }

      - name: "irrigation_controller_l1"
        unique_id: "irrigation_controller_l1"
        state: "off"
        turn_on:
          - action: logger.log
            data: { message: "zone 5 on (simulated)", level: info }
        turn_off:
          - action: logger.log
            data: { message: "zone 5 off (simulated)", level: info }

      - name: "irrigation_controller_l2"
        unique_id: "irrigation_controller_l2"
        state: "off"
        turn_on:
          - action: logger.log
            data: { message: "zone 6 on (simulated)", level: info }
        turn_off:
          - action: logger.log
            data: { message: "zone 6 off (simulated)", level: info }

      - name: "irrigation_controller_l3"
        unique_id: "irrigation_controller_l3"
        state: "off"
        turn_on:
          - action: logger.log
            data: { message: "zone 7 on (simulated)", level: info }
        turn_off:
          - action: logger.log
            data: { message: "zone 7 off (simulated)", level: info }

      - name: "irrigation_controller_l4"
        unique_id: "irrigation_controller_l4"
        state: "off"
        turn_on:
          - action: logger.log
            data: { message: "zone 8 on (simulated)", level: info }
        turn_off:
          - action: logger.log
            data: { message: "zone 8 off (simulated)", level: info }

name: Security
permissions:
    contents: read
    pull-requests: read
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    gitleaks:
        name: Secret scan (gitleaks)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # full history so gitleaks can diff the entire branch

            - uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

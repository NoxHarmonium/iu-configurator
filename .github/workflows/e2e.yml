name: E2E

on:
  # Weekly run: tests iu-configurator:latest against the latest IU release.
  schedule:
    - cron: "0 0 * * 0" # Sunday midnight UTC

  # Allow manual triggers from the Actions UI.
  workflow_dispatch:

env:
  ECR_REPOSITORY: public.ecr.aws/j0s7z4j0/hopyard/iu-configurator

jobs:
  e2e:
    name: Smoke test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      # ── AWS auth (needed to pull the iu-configurator image from ECR) ────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_READONLY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # ── Resolve the latest Irrigation Unlimited release ─────────────────────
      - name: Resolve latest IU release tag
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          IU_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rgc99/irrigation_unlimited/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')
          echo "Resolved IU_VERSION=${IU_TAG}"
          echo "IU_VERSION=${IU_TAG}" >> "$GITHUB_ENV"

      # ── Start the stack ────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Make config dir writable
        run: mkdir -p dev/config && chmod a+w dev/config

      - name: Start stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      # ── Wait for the app to be ready ──────────────────────────────────────
      # The HA bootstrap service runs first; the app only becomes available
      # after bootstrap completes and iu-configurator connects to HA.
      - name: Wait for iu-configurator
        run: |
          curl \
            --silent \
            --retry 30 \
            --retry-delay 10 \
            --retry-connrefused \
            --output /dev/null \
            http://localhost:3000

      # ── Playwright ────────────────────────────────────────────────────────
      - name: Install Node dependencies
        working-directory: end2end
        run: npm ci

      - name: Install Playwright browsers
        working-directory: end2end
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: end2end
        env:
          CI: "true"
          BASE_URL: "http://localhost:3000"
        run: npm run test:ci

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Collect stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          --no-color > /tmp/stack-logs.txt 2>&1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: end2end/playwright-report/
          retention-days: 7

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-logs
          path: /tmp/stack-logs.txt
          retention-days: 7

      # ── Teardown ──────────────────────────────────────────────────────────
      - name: Tear down stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain via rust-toolchain.toml if you add one; otherwise stable is used.

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (ssr)
        run: cargo clippy --features ssr --no-default-features -- -D warnings

      - name: Clippy (hydrate / wasm)
        run: cargo clippy --features hydrate --no-default-features --target wasm32-unknown-unknown -- -D warnings

      - name: Tests (ssr)
        run: cargo test --features ssr --no-default-features

  # ── Docker build check ───────────────────────────────────────────────────────
  # Verifies the Dockerfile builds correctly on every PR and main push.
  # No registry credentials are required — `push: false` keeps everything local.
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: setup-buildx

      - name: Cache Docker build mounts
        uses: actions/cache@v5
        id: cache
        with:
          path: cache-mount
          key: cache-mount-amd64-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: |
            cache-mount-amd64-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

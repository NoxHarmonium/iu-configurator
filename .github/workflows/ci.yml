name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  # Pin the toolchain via rust-toolchain.toml if you add one; otherwise stable is used.

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (ssr)
        run: cargo clippy --features ssr --no-default-features -- -D warnings

      - name: Clippy (hydrate / wasm)
        run: cargo clippy --features hydrate --no-default-features --target
          wasm32-unknown-unknown -- -D warnings

      - name: Tests (ssr)
        run: cargo test --features ssr --no-default-features

  # ── Docker build check ───────────────────────────────────────────────────────
  # Verifies the Dockerfile builds correctly on every PR and main push.
  # No registry credentials are required — `push: false` keeps everything local.
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: setup-buildx

      - name: Cache Docker build mounts
        uses: actions/cache@v6
        id: cache
        with:
          path: cache-mount
          key: cache-mount-amd64-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: |
            cache-mount-amd64-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: cache-mount
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: iu-configurator:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

      # ── E2E smoke tests against the locally built image ──────────────────
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: end2end/package-lock.json

      # The runtime image runs as UID 568; the checkout-owned dev/config dir is
      # owned by the runner (UID 1001), so we make it world-writable before
      # mounting it into the container.
      - name: Make config dir writable
        run: mkdir -p dev/config && chmod a+w dev/config

      - name: Start stack
        env:
          IU_IMAGE: iu-configurator:ci
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for iu-configurator
        run: |
          curl \
            --silent \
            --retry 30 \
            --retry-delay 10 \
            --retry-connrefused \
            --output /dev/null \
            http://localhost:3000

      - name: Install Node dependencies
        working-directory: end2end
        run: npm ci

      - name: Install Playwright browsers
        working-directory: end2end
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: end2end
        env:
          CI: "true"
          BASE_URL: "http://localhost:3000"
        run: npm run test:ci

      - name: Collect stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          --no-color > /tmp/stack-logs.txt 2>&1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: end2end/playwright-report/
          retention-days: 7

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-logs
          path: /tmp/stack-logs.txt
          retention-days: 7

      - name: Upload config dir
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: config-dir
          path: dev/config
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

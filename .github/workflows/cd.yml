name: Build & Push

on:
  push:
    tags: ["v*.*.*"]

env:
  ECR_REGISTRY: public.ecr.aws
  ECR_REPOSITORY: public.ecr.aws/j0s7z4j0/hopyard/iu-configurator

permissions:
  id-token: write

jobs:
  build-and-push:
    name: Build multi-arch image and push to ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC auth with AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── AWS auth ─────────────────────────────────────────────────────────────
      # Expects OIDC-based auth. Add these secrets to your repo:
      #   AWS_ROLE_TO_ASSUME  — ARN of the IAM role with ecr-public:GetAuthorizationToken
      #                         and ecr-public:BatchCheckLayerAvailability /
      #                         ecr-public:PutImage / ecr-public:InitiateLayerUpload /
      #                         ecr-public:UploadLayerPart / ecr-public:CompleteLayerUpload
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1 # ECR Public is always in us-east-1

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # ── Docker Buildx for multi-arch ─────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Derive image tags ────────────────────────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # ── Build & push ──────────────────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

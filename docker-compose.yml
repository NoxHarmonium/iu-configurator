# Development stack: iu-configurator (hot-reload) + Home Assistant + Irrigation Unlimited
#
# ── Quick start ──────────────────────────────────────────────────────────────
#
#   First run (builds images, compiles iu-configurator from scratch — slow):
#     docker compose up --build
#
#   Hot-reload dev (syncs source changes, cargo-leptos-watch recompiles inside):
#     docker compose watch
#
#   Ports:
#     http://localhost:3000  — iu-configurator
#     http://localhost:8123  — Home Assistant
#
# ── Automated HA setup ───────────────────────────────────────────────────────
#
#   On a fresh stack (new ha-config volume), the ha-bootstrap service runs
#   automatically: it completes HA onboarding (admin/admin) and writes
#   dev/config/ha.env containing HA_TOKEN and HA_URL. iu-configurator picks
#   these up via env_file and connects to HA without any manual steps.
#
#   If HA was already onboarded manually, bootstrap skips and you can provide
#   the token by creating dev/config/ha.env yourself:
#     HA_TOKEN=<your-long-lived-token>
#     HA_URL=http://homeassistant:8123
#
# ── Shared config ─────────────────────────────────────────────────────────────
#
#   iu-configurator writes to dev/config/ (bind-mounted at /config).
#   HA mounts the same directory read-only at /config/iu/ so it can load
#   irrigation_unlimited.yaml via its `!include iu/irrigation_unlimited.yaml`.
#
name: iu-dev

services:
  iu-configurator:
    build:
      target: dev
    ports:
      - "3000:3000" # app server
      - "3001:3001" # leptos hot-reload WebSocket
    environment:
      LEPTOS_ENV: DEV
      CONFIG_DIR: /config
      # Generated by bootstrap script
      ENV_FILE: /config/ha.env
    volumes:
      # Cargo caches — survive container restarts so recompilation stays fast
      - iu-cargo-registry:/usr/local/cargo/registry
      - iu-cargo-git:/usr/local/cargo/git
      - iu-target:/app/target
      # Shared config dir — iu-configurator writes here, HA reads it
      - ./dev/config:/config
    # `docker compose watch` syncs source files to the container;
    # cargo-leptos-watch inside handles incremental recompilation.
    develop:
      watch:
        - path: ./src
          action: sync
          target: /app/src
        - path: ./style
          action: sync
          target: /app/style
        - path: ./public
          action: sync
          target: /app/public
        - path: ./Cargo.toml
          action: rebuild
        - path: ./Cargo.lock
          action: rebuild
    depends_on:
      homeassistant:
        condition: service_started
      ha-bootstrap:
        condition: service_completed_successfully

  ha-bootstrap:
    build:
      context: dev/ha-bootstrap
    volumes:
      - ./dev/config:/config
    depends_on:
      homeassistant:
        condition: service_started
    restart: "no"

  homeassistant:
    build:
      context: dev/ha
      args:
        # https://github.com/rgc99/irrigation_unlimited/releases
        IU_VERSION: "2025.12.0"
        # https://github.com/rgc99/irrigation-unlimited-card/releases
        IU_CARD_VERSION: "2026.1.0"
    ports:
      - "8123:8123"
    environment:
      TZ: Australia/Sydney
    volumes:
      # HA persistent state (DB, .storage, logs) — separate from seed config
      - ha-config:/config
      # iu-configurator output — read-only, mounted as a subdirectory of HA config
      - ./dev/config:/config/iu:ro
    restart: unless-stopped

volumes:
  iu-cargo-registry:
  iu-cargo-git:
  iu-target:
  ha-config:
